name: Lean Harness CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip uv==0.13.0
      - run: uv sync --locked --extra mcp --extra legacy --python ${{ matrix.python }}
      - run: uv run --locked --extra mcp --extra legacy python -m pytest tests -q -m "not live"
      - run: uv run --locked --extra mcp --extra legacy python -m compileall -q miniagent
      - run: uv run --locked --extra mcp --extra legacy python scripts/source_stats.py
      - run: uv build
