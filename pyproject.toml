[project]
name = "miniagent"
version = "0.3.0a1"
description = "A Python-native mini harness and coding agent with plugins, MCP, Skills, and resumable sessions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "MiniAgent Team", email = "miniagent@example.com" },
]
keywords = [
    "agent",
    "ai",
    "llm",
    "cli",
    "tool-calling",
    "miniagent",
    "deepseek",
    "openai",
    "code-generation",
    "automation",
    "agentic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "any-llm-sdk==1.33.0",
    "jsonschema>=4.20,<5",
    "python-dotenv>=0.19.0",
    "rich>=13.0.0",
]

[project.urls]
"Bug Tracker" = "https://github.com/ZhuLinsen/MiniAgent/issues"
Documentation = "https://github.com/ZhuLinsen/MiniAgent#readme"
Source = "https://github.com/ZhuLinsen/MiniAgent"

[project.scripts]
miniagent = "miniagent.cli:main"

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]
credentials = ["keyring>=25,<26"]
dev = [
    "pytest>=9.0.3,<10",
    "psutil>=5.9,<8",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ruff==0.17.0",
    "pip-audit==2.10.1",
    "psutil>=5.9,<8",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["miniagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in real provider tests requiring explicit credentials"]

[tool.uv]
constraint-dependencies = ["anyio>=4.14.2", "urllib3>=2.8.0"]
